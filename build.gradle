
plugins {
  id 'java-library'
  id 'eclipse'
  id 'application'
}

defaultTasks 'jar'

test
{
  useJUnitPlatform()
  outputs.upToDateWhen { false }
  testLogging {
    showStandardStreams = true
    events "passed", "skipped", "failed"
    exceptionFormat = "full"
  }
}


repositories {
  mavenCentral()
}

def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def isArm  = osArch.contains("aarch64") || osArch.contains("arm")

def fxClassifier =
    osName.contains("win") ? "win" :
    osName.contains("mac") ? (isArm ? "mac-aarch64" : "mac") :
                             (isArm ? "linux-aarch64" : "linux")

def fxVersion = "22.0.1"


dependencies {
  ['javafx-base', 'javafx-graphics', 'javafx-controls', 'javafx-swing'].each { m ->
    implementation "org.openjfx:$m:$fxVersion"
    implementation "org.openjfx:$m:$fxVersion:$fxClassifier"
  }

  implementation 'commons-cli:commons-cli:1.11.0'
  implementation 'org.swinglabs:swingx:0.9.4'
  implementation 'com.ibm.icu:icu4j:78.3'
  implementation 'com.jgoodies:looks:2.2.1'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0'
  implementation 'com.miglayout:miglayout-swing:5.2'
  implementation 'com.miglayout:miglayout-javafx:5.2'
  //implementation 'org.fxmisc.richtext:richtextfx:0.10.6'
  implementation 'org.fxmisc.flowless:flowless:0.6.3'
  implementation 'org.fxmisc.undo:undofx:2.1.0'
  implementation 'org.fxmisc.wellbehaved:wellbehavedfx:0.3.3'
  implementation 'org.reactfx:reactfx:2.0.M5'

  testImplementation 'org.junit.jupiter:junit-jupiter:5.13.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

application {
  mainClass.set('org.jmeld.Main');
  //mainClass.set('org.jmeld.fx.JMeldFxMain');
}

task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'org.jmeld.fx.JMeldFxMain'
    }
    archiveBaseName = 'JMeldAll'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
